function TheWeddingOfRomeojuliet() {
  const [lbImg, setLbImg] = React.useState(null);

  const copyRek = (text, idx) => {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).catch(() => {});
    }
    setCopiedIdx(idx);
    setTimeout(() => setCopiedIdx((cur) => (cur === idx ? null : cur)), 1800);

  const [wishes, setWishes] = React.useState(() => {
    try { return JSON.parse(localStorage.getItem('ktm_wishes') || '[]'); } catch (e) { return []; }
  });

  const [wRsvp, setWRsvp] = React.useState('');

    if (!wName.trim() || !wMsg.trim()) return;
    const entry = { nama: wName.trim(), rsvp: wRsvp, pesan: wMsg.trim(), waktu: Date.now() };
    const next = [entry, ...wishes];

    const hhmm = parseTimeToHHMM(cdTime);
    const target = new Date(cdDate + 'T' + hhmm + ':00+07:00');
    const tick = () => {
      const diff = Math.max(0, target - new Date());
      setCd({
        d: Math.floor(diff / 86400000),
        h: Math.floor((diff % 86400000) / 3600000),
        m: Math.floor((diff % 3600000) / 60000),
        s: Math.floor((diff % 60000) / 1000),
      });
    };
    tick();
    const id = setInterval(tick, 1000);
    return () => clearInterval(id);

  const defaultStories = [
    { date: '01 JUL 2022', title: 'Pertemuan', icon: 'fa-champagne-glasses', text: 'Tidak ada yang kebetulan di dunia ini, semua sudah tersusun rapi oleh yang Maha Kuasa. Kisah ini berawal saat kami bertemu pertama kalinya tanpa sengaja di salah satu tempat nongkrong. Lalu dia ngefollow Instagram saya tanpa ada percakapan apapun.' },
    { date: '10 OKT 2022', title: 'Pendekatan', icon: 'fa-comments', text: 'Setelah 3 bulan melewati PDKT dari Instagram dan juga sudah bertukaran no WhatsApp, bertepatan dengan ulangtahun saya, dia menyatakan cintanya dan saya menerimanya. Perjalanan kami bukan hanya tentang kebahagiaan, tapi tentang proses saling mendewasakan.' },

  ];

        title: s.judul || ('Momen ' + (i + 1)),

        img: _stImgs[i] || '',
      }))
    : defaultStories;

  const openMaps = (url) => { if (url) window.open(url, '_blank', 'noopener,noreferrer'); };
  const saveCalendar = () => {
    if (!cdDate) return;
    const hhmm = parseTimeToHHMM(cdTime);
    const [hh, mm] = hhmm.split(':');
    const start = cdDate.replace(/-/g, '') + 'T' + hh + mm + '00';
    const endH = String((+hh + 3) % 24).padStart(2, '0');
    const end = cdDate.replace(/-/g, '') + 'T' + endH + mm + '00';

      'https://calendar.google.com/calendar/render?action=TEMPLATE&text=' + encodeURIComponent(title)
      + '&dates=' + start + '/' + end
      + '&location=' + encodeURIComponent(loc),
      '_blank', 'noopener,noreferrer'
    );
  };
  return (
    <div className="bg-[#F8F5F0] content-stretch flex flex-col items-start relative size-full">

        <div className="bg-clip-padding border-0 border-[transparent] border-solid content-stretch flex flex-col items-start overflow-clip relative rounded-[inherit] size-full">

              <div className="absolute h-[141px] left-[20px] top-[50px] w-[390px]" />

                The Wedding Of

                <div style={{

   APP WRAPPER — manages cover open/close state
   ───────────────────────────────────────────── */
function App() {
  const [closing, setClosing] = React.useState(false);
  const [gone,    setGone]    = React.useState(false);

  /* kunci scroll selama cover tampil */
  React.useEffect(() => {
    document.body.style.overflow = 'hidden';
    document.documentElement.style.overflow = 'hidden';
  }, []);

  /* pastikan ikon musik tersembunyi selama cover tampil (tidak bergantung pada dukungan CSS :has()) */
  React.useEffect(() => {
    const mf = document.getElementById('music-float');
    if (mf) mf.style.display = gone ? 'flex' : 'none';
  }, [gone]);

  function openInvitation() {
    const el = document.getElementById('cover-overlay');
    const audio = document.getElementById('bg-music');
    if (audio) {
      audio.volume = 0.7;
      audio.currentTime = 0;
      const playPromise = audio.play();
      if (playPromise && playPromise.catch) playPromise.catch(() => {});
    }
    if (el) el.classList.add('closing');
    setClosing(true);
    setTimeout(() => {
      setGone(true);
      /* buka kunci scroll setelah cover hilang */
      document.body.style.overflow = '';
      document.documentElement.style.overflow = '';
    }, 1050);
  }

  return (
    <>
      <TheWeddingOfRomeojuliet />
      {!gone && <Cover onOpen={openInvitation} />}
    </>
  );
}

ReactDOM.createRoot(document.getElementById("app-container")).render(React.createElement(App));

<script>
(function(){
  var DESIGN_W = 430;
  function applyScale(){
    var el = document.getElementById('app-container');
    if(!el) return;
    var vw = window.innerWidth;
    if(vw < DESIGN_W){
      var scale = vw / DESIGN_W;
      el.style.transform = 'scale(' + scale + ')';
      el.style.marginBottom = Math.round((scale - 1) * el.offsetHeight) + 'px';
    } else {
      el.style.transform = '';
      el.style.marginBottom = '';
    }
  }
  function waitAndScale(){
    var el = document.getElementById('app-container');
    if(el && el.offsetHeight > 100){
      applyScale();
    } else {
      setTimeout(waitAndScale, 50);
    }
  }
  waitAndScale();
  window.addEventListener('resize', applyScale);
})();
</script>

      var swayX = Math.round((Math.random()-0.5)*170);
      var midX  = Math.round((Math.random()-0.5)*70);
      var rot   = Math.round(-40+Math.random()*80);
      var peak  = (0.38+Math.random()*0.42).toFixed(2);
      css += '@keyframes lf'+i+'{'
        +'0%{opacity:0;transform:translate(0,0) rotate(0deg)}'
        +'8%{opacity:'+peak+'}'
        +'30%{transform:translate('+midX+'px,-28vh) rotate('+(rot/2)+'deg)}'
        +'65%{transform:translate('+(swayX*0.6|0)+'px,-62vh) rotate('+rot+'deg);opacity:'+peak+'}'
        +'92%{opacity:0.12}'
        +'100%{opacity:0;transform:translate('+swayX+'px,-108vh) rotate('+(rot*1.6|0)+'deg)}'
        +'}';
    }

    var st = document.createElement('style');
    st.textContent = css;
    document.head.appendChild(st);

    /* leaf layer — floats upward, clipped to the verse section */
    var wrap = document.createElement('div');
    wrap.style.cssText = 'position:absolute;top:0;left:0;width:430px;height:1388.781px;pointer-events:none;overflow:hidden;z-index:4';

    /* — leaves — */
    for (var j = 0; j < N_LEAF; j++) {
      var sz   = (13+Math.random()*15)|0;
      var dur  = (22+Math.random()*28).toFixed(1);
      var del  = (-Math.random()*parseFloat(dur)).toFixed(1);
      var lx   = (Math.random()*100).toFixed(1);
      var col  = leafColors[(Math.random()*leafColors.length)|0];
      var lp   = leafPaths[(Math.random()*leafPaths.length)|0];

      var svg = document.createElementNS('http://www.w3.org/2000/svg','svg');
      svg.setAttribute('width', sz);
      svg.setAttribute('height', sz);
      svg.setAttribute('viewBox','-15 -24 30 48');
      svg.style.cssText = 'position:absolute;bottom:'+(-sz/2|0)+'px;left:'+lx+'%;opacity:0;transform-origin:center center;animation:lf'+j+' '+dur+'s ease-in-out '+del+'s infinite';

      var pth = document.createElementNS('http://www.w3.org/2000/svg','path');
      pth.setAttribute('d', lp);
      pth.setAttribute('fill', col);
      pth.setAttribute('stroke','#002366');
      pth.setAttribute('stroke-width','0.9');
      pth.setAttribute('stroke-opacity','0.35');
      svg.appendChild(pth);

      var vein = document.createElementNS('http://www.w3.org/2000/svg','line');
      vein.setAttribute('x1','0'); vein.setAttribute('y1','-18');
      vein.setAttribute('x2','0'); vein.setAttribute('y2','16');
      vein.setAttribute('stroke','#002366');
      vein.setAttribute('stroke-width','0.7');
      vein.setAttribute('stroke-opacity','0.45');
      svg.appendChild(vein);

      var vl = document.createElementNS('http://www.w3.org/2000/svg','line');
      vl.setAttribute('x1','-1'); vl.setAttribute('y1','-4');
      vl.setAttribute('x2','-7'); vl.setAttribute('y2','2');
      vl.setAttribute('stroke','#002366');
      vl.setAttribute('stroke-width','0.5');
      vl.setAttribute('stroke-opacity','0.35');
      svg.appendChild(vl);

      var vr = document.createElementNS('http://www.w3.org/2000/svg','line');
      vr.setAttribute('x1','1'); vr.setAttribute('y1','-4');
      vr.setAttribute('x2','7'); vr.setAttribute('y2','2');
      vr.setAttribute('stroke','#002366');
      vr.setAttribute('stroke-width','0.5');
      vr.setAttribute('stroke-opacity','0.35');
      svg.appendChild(vr);

      wrap.appendChild(svg);
    }

    document.getElementById('app-container').appendChild(wrap);
  }

  /* ── 3. Scroll parallax on section backgrounds + hero text layers ── */
  function getScale() {
    return window.innerWidth < DESIGN_W ? window.innerWidth / DESIGN_W : 1;
  }

  function collectHeroLayers() {
    heroLayers = [];
    var heroSec = document.getElementById('hero-section');
    if (!heroSec) return;
    document.querySelectorAll('[data-px-rate]').forEach(function(el) {
      var rate = parseFloat(el.getAttribute('data-px-rate') || 0);
      if (!rate) return;
      el.style.willChange = 'transform';
      /* capture existing horizontal transform so we don't lose it */
      var baseTx = el.classList.contains('-translate-x-1/2')
        ? 'translateX(-50%)'
        : (el.style.transform || '').replace(/\s*translateY\([^)]*\)/g, '').trim();
      heroLayers.push({ el: el, sec: heroSec, rate: rate, baseTx: baseTx });
    });
  }

  function hasRoundedAncestor(img, container) {
    var el = img.parentElement;
    for (var n = 0; n < 10; n++) {
      if (!el || el === container) return false;
      var cn = el.className || '';
      if (/rounded-\[(?:500|14)/.test(cn)) return true;
      el = el.parentElement;
    }
    return false;
  }

  function collectTargets() {
    var c = document.getElementById('app-container');
    if (!c) return;
    pxItems = [];

    c.querySelectorAll('img.object-cover').forEach(function(img) {
      /* skip portrait photos inside oval frames (rounded-[500px] is on parent, not img) */
      if (hasRoundedAncestor(img, c)) return;

      /* walk up to find the nearest overflow-clip container */
      var sec = img.parentElement;
      for (var n = 0; n < 10; n++) {
        if (!sec || sec === c) { sec = null; break; }
        if (sec.classList && sec.classList.contains('overflow-clip')) break;
        sec = sec.parentElement;
      }
      if (!sec || sec === c) return;

      img.style.willChange     = 'transform';
      img.style.transformOrigin = 'center center';
      pxItems.push({
        img  : img,
        sec  : sec,
        rate : 0.14 + Math.random() * 0.08
      });
    });
  }

  function applyParallax() {
    rafPend = false;
    var scale = getScale();
    var vh    = window.innerHeight;

    /* ── background image parallax ── */
    pxItems.forEach(function(p) {
      var r        = p.sec.getBoundingClientRect();
      var secMidY  = r.top + r.height * 0.5;
      var diff     = secMidY - vh * 0.5;
      var clampMax = r.height * 0.16;
      diff = Math.max(-clampMax, Math.min(clampMax, diff));
      var dy = (diff * p.rate) / scale;
      p.img.style.transform = 'translateY('+dy.toFixed(1)+'px) scale(1.35)';
    });

    /* ── hero text layer parallax (multi-depth) ── */
    heroLayers.forEach(function(p) {
      var r       = p.sec.getBoundingClientRect();
      /* skip when hero is completely out of viewport */
      if (r.bottom < 0 || r.top > vh) return;
      var secMidY  = r.top + r.height * 0.5;
      var diff     = secMidY - vh * 0.5;
      var clampMax = r.height * 0.22;
      diff = Math.max(-clampMax, Math.min(clampMax, diff));
      var dy = (diff * p.rate) / scale;
      p.el.style.transform = (p.baseTx ? p.baseTx + ' ' : '') + 'translateY('+dy.toFixed(1)+'px)';
    });
  }

  function onScroll() {
    if (!rafPend) { rafPend = true; requestAnimationFrame(applyParallax); }
  }

  /* ── Boot after React renders ── */
  /* ── Scroll-triggered entrance animations ── */
  function initScrollAnims() {
    var targets = document.querySelectorAll('[data-anim]');
    if (!targets.length || !('IntersectionObserver' in window)) {
      /* fallback: show everything immediately */
      targets.forEach(function(el) { el.classList.add('anim-in'); });
      return;
    }
    var io = new IntersectionObserver(function(entries) {
      entries.forEach(function(e) {
        if (!e.isIntersecting) return;
        var el    = e.target;
        var delay = parseInt(el.getAttribute('data-delay') || 0);
        var isPhoto = el.getAttribute('data-anim') === 'groom-frame' ||
                      el.getAttribute('data-anim') === 'bride-frame';
        setTimeout(function() {
          el.classList.add('anim-in');
          if (isPhoto) {
            /* brief gold glow after the frame slides in */
            setTimeout(function() { el.classList.add('anim-glow'); }, 80);
          }
        }, delay);
        io.unobserve(el);
      });
    }, { threshold: 0.12, rootMargin: '0px 0px -30px 0px' });

    targets.forEach(function(el) { io.observe(el); });
  }

  function init() {
    var c = document.getElementById('app-container');
    if (!c || c.offsetHeight < 200) { setTimeout(init, 80); return; }
    initParticles();
    initNature();
    collectTargets();
    collectHeroLayers();
    applyParallax();
    initScrollAnims();
    window.addEventListener('scroll', onScroll, { passive: true });
    window.addEventListener('resize', function() { collectTargets(); collectHeroLayers(); applyParallax(); });
  }

  init();
})();
</script>
</body>
</html>
