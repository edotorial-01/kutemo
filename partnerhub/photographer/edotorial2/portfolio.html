<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portofolio — Edotorial Photo</title>
<link rel="stylesheet" href="style.css">
<style>
  .page-head { padding: 4px 20px 0; }
  .page-head h1 { font-family: var(--font-display); font-size: 26px; font-weight: 600; margin: 10px 0 4px; }
  .page-head p { font-size: 13px; color: var(--text-secondary); margin-bottom: 16px; }
  .chip-row { margin-bottom: 16px; }
  .photo-card img { cursor: zoom-in; }
</style>
</head>
<body>

  <div class="status-spacer"></div>
  <div class="topbar">
    <a href="index.html" class="icon-btn" aria-label="Kembali">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
    </a>
    <span class="brand">Portofolio</span>
    <button class="icon-btn theme-toggle" id="themeToggle" aria-label="Ganti mode gelap/terang">
      <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8Z"/></svg>
      <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </div>

  <div class="page-head">
    <h1>Galeri Karya</h1>
    <p>Kumpulan hasil jepretan dari berbagai sesi — pilih kategori untuk lihat lebih spesifik.</p>
  </div>

  <div class="chip-row">
    <button class="chip active" data-filter="all">Semua</button>
    <button class="chip" data-filter="wedding">Wedding</button>
    <button class="chip" data-filter="prewedding">Prewedding</button>
    <button class="chip" data-filter="Enggagement">Enggagement</button>
    <button class="chip" data-filter="event">Event</button>
  </div>

  <div class="card-grid" style="margin-top:6px;">

    <div class="photo-card" data-category="wedding">
      <img class="thumb" data-lightbox="https://images.unsplash.com/photo-1519225421980-715cb0215aed?q=80&w=1200&auto=format&fit=crop"
           src="https://images.unsplash.com/photo-1519225421980-715cb0215aed?q=80&w=600&auto=format&fit=crop" alt="Wedding 1">
      <div class="meta"><span class="exif-tag">ƒ/2.0 · 1/250</span></div>
    </div>

    <div class="photo-card" data-category="prewedding">
      <img class="thumb" data-lightbox="https://images.unsplash.com/photo-1591604466107-ec97de577aff?q=80&w=1200&auto=format&fit=crop"
           src="https://images.unsplash.com/photo-1591604466107-ec97de577aff?q=80&w=600&auto=format&fit=crop" alt="Prewedding 1">
      <div class="meta"><span class="exif-tag">ƒ/1.8 · 1/320</span></div>
    </div>

    <div class="photo-card" data-category="Enggagement">
      <img class="thumb" data-lightbox="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?q=80&w=1200&auto=format&fit=crop"
           src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?q=80&w=600&auto=format&fit=crop" alt="Enggagement 1">
      <div class="meta"><span class="exif-tag">ƒ/8 · 1/125</span></div>
    </div>

    <div class="photo-card" data-category="event">
      <img class="thumb" data-lightbox="https://images.unsplash.com/photo-1511795409834-ef04bbd61622?q=80&w=1200&auto=format&fit=crop"
           src="https://images.unsplash.com/photo-1511795409834-ef04bbd61622?q=80&w=600&auto=format&fit=crop" alt="Event 1">
      <div class="meta"><span class="exif-tag">ƒ/2.8 · 1/200</span></div>
    </div>

    <div class="photo-card" data-category="wedding">
      <img class="thumb" data-lightbox="https://images.unsplash.com/photo-1583939003579-730e3918a45a?q=80&w=1200&auto=format&fit=crop"
           src="https://images.unsplash.com/photo-1583939003579-730e3918a45a?q=80&w=600&auto=format&fit=crop" alt="Wedding 2">
      <div class="meta"><span class="exif-tag">ƒ/2.2 · 1/200</span></div>
    </div>

    <div class="photo-card" data-category="prewedding">
      <img class="thumb" data-lightbox="https://images.unsplash.com/photo-1519741497674-611481863552?q=80&w=1200&auto=format&fit=crop"
           src="https://images.unsplash.com/photo-1519741497674-611481863552?q=80&w=600&auto=format&fit=crop" alt="Prewedding 2">
      <div class="meta"><span class="exif-tag">ƒ/1.4 · 1/400</span></div>
    </div>

  </div>

  <div style="height:24px"></div>

  <nav class="bottom-nav">
    <a href="index.html" class="nav-item">
      <svg viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5M5 10v9a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1v-9"/></svg>
      Beranda
    </a>
    <a href="portfolio.html" class="nav-item active">
      <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-5-5L5 21"/></svg>
      Portofolio
    </a>
    <a href="booking.html" class="nav-item">
      <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="3"/><path d="M8 2v4M16 2v4M3 10h18"/></svg>
      Booking
    </a>
    <a href="storage.html" class="nav-item">
      <svg viewBox="0 0 24 24"><path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"/></svg>
      Awan
    </a>
    <a href="#" class="nav-item">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 5-6 8-6s6.5 2 8 6"/></svg>
      Profil
    </a>
  </nav>

  <script src="script.js"></script>
</body>
</html>
